# Same-origin setup: the browser talks only to this server. Static files are
# served from disk; /api is proxied to the API container. This is the shape a
# production deployment keeps (with TLS terminated here or at a load balancer).
server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;

  # Slightly above the API's 5 MB import limit so the API returns the error.
  client_max_body_size 6m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # One request ID from the edge to the API logs.
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 60s;
  }

  # Fingerprinted build assets never change: cache for a year.
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Single-page app: unknown paths get index.html; never cache it.
  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
