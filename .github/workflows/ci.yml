name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: finpilot
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: finpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finpilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Throwaway credentials for the CI service container only.
      TEST_DATABASE_URL: postgres://finpilot:ci-only-password@localhost:5432/finpilot_test?sslmode=disable
      MIGRATION_CHECK_URL: postgres://finpilot:ci-only-password@localhost:5432/finpilot_migrations?sslmode=disable

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Audit dependencies (fail on high/critical)
        run: pnpm audit --audit-level=high

      - name: Migrations apply and roll back cleanly
        working-directory: apps/api
        run: |
          dbmate() { pnpm exec dbmate --url "$MIGRATION_CHECK_URL" --migrations-dir ../../db/migrations --no-dump-schema "$@"; }
          dbmate create
          dbmate up
          migrations=$(ls ../../db/migrations/*.sql | wc -l)
          for _ in $(seq "$migrations"); do dbmate rollback; done
          tables=$(psql "$MIGRATION_CHECK_URL" -tAc "select count(*) from pg_tables where schemaname = 'public' and tablename <> 'schema_migrations'")
          test "$tables" -eq 0 || { echo "::error::rollback left $tables tables behind"; exit 1; }
          dbmate up

      - name: Generated database types are up to date
        working-directory: apps/api
        run: >-
          pnpm exec kysely-codegen --verify --url "$MIGRATION_CHECK_URL" --dialect postgres
          --date-parser string --numeric-parser string --out-file src/db/schema.ts

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Deployment check: build the production images and bring up the full stack
  # exactly as `docker compose up` does locally, then smoke-test it end to end.
  docker-stack:
    name: Docker stack smoke test
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Create .env from the example (random JWT secret)
        run: |
          cp .env.example .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" .env

      - name: Build images and start the stack
        run: docker compose up --build -d --wait

      - name: Smoke test through the web server
        run: scripts/smoke-test.sh http://localhost:8088

      - name: Migrations and seed are idempotent on restart
        run: |
          docker compose up -d --wait
          docker compose logs migrate --no-log-prefix | grep -c ALREADY_IMPORTED | grep -qx 7

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v
